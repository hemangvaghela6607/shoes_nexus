<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Sign In — SHOE NEXUS</title>
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Admin Master Stylesheet (Clean White Theme) -->
    <link rel="stylesheet" href="css/admin.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #FFF6F3 0%, #F8FAFC 100%); padding: 20px;">

    <!-- Admin Clean White Login Card -->
    <div style="width: 100%; max-width: 420px; background-color: var(--white); border: 1px solid var(--gray-200); border-radius: var(--radius-lg); padding: 36px; box-shadow: var(--shadow-md);">
        <!-- Logo -->
        <div style="text-align: center; margin-bottom: 28px;">
            <div style="width: 48px; height: 48px; background-color: var(--primary); border-radius: var(--radius-md); display: inline-flex; align-items: center; justify-content: center; font-size: 1.4rem; color: #FFF; margin-bottom: 12px;">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <h2 style="font-family: var(--font-heading); font-size: 1.5rem; font-weight: 800; color: var(--dark-900);">SHOE NEXUS</h2>
            <span style="font-size: 0.75rem; font-weight: 700; color: var(--primary); letter-spacing: 1.5px; text-transform: uppercase;">Admin Management Console</span>
        </div>

        <form action="dashboard.html" method="GET">
            <div style="margin-bottom: 18px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--dark-800); margin-bottom: 6px;">Admin Email</label>
                <input type="email" class="admin-input" value="admin@shoenexus.in" style="width: 100%; padding: 10px 14px;" required>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 0.85rem; font-weight: 600; color: var(--dark-800); margin-bottom: 6px;">Master Password</label>
                <input type="password" class="admin-input" value="admin12345" style="width: 100%; padding: 10px 14px;" required>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-size: 0.85rem; color: var(--gray-600);">
                <label style="display: flex; align-items: center; gap: 6px; cursor: pointer;">
                    <input type="checkbox" checked style="accent-color: var(--primary);"> Remember Session
                </label>
            </div>

            <button type="submit" class="btn-admin-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 0.95rem;">
                Sign In to Console <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; font-size: 0.88rem; color: var(--gray-500); border-top: 1px solid var(--gray-200); padding-top: 16px;">
            <a href="D:\MU_SEM_3\WT\Project_shoes_nexus\clean_version\login.html" style="color: var(--dark-800); font-weight: 600;">
                    <i class="fa-solid fa-arrow-left"></i> User login
                </a>
            <a href="../index.html" style="color: var(--dark-900); font-weight: 600;">
                <i class="fa-solid fa-arrow-left"></i> Return to Live Store
            </a>

        </div>
    </div>

</body>
</html>
