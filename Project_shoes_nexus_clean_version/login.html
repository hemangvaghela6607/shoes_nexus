<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login & Register — SHOE NEXUS</title>
    <!-- Font Awesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Master Stylesheet (Clean White Theme) -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: linear-gradient(135deg, #FFF6F3 0%, #F8FAFC 100%);">

    <!-- Auth Centered Wrapper -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <!-- Brand Logo -->
            <div style="text-align: center; margin-bottom: 24px;">
                <a href="index.html" class="brand-logo" style="justify-content: center;">
                    <div class="logo-icon"><i class="fa-solid fa-bolt"></i></div>
                    <span>SHOE<span class="highlight">NEXUS</span></span>
                </a>
            </div>

            <!-- Pure CSS Radio Tabs (Zero JS) -->
            <input type="radio" name="auth_tab" id="tab-login" class="auth-tab-radio" checked>
            <input type="radio" name="auth_tab" id="tab-register" class="auth-tab-radio">

            <div class="auth-tabs">
                <label for="tab-login" class="auth-tab-label">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </label>
                <label for="tab-register" class="auth-tab-label">
                    <i class="fa-solid fa-user-plus"></i> Register
                </label>
            </div>

            <!-- 1. SIGN IN PANEL -->
            <div class="auth-panel panel-login">
                <form action="index.html" method="GET">
                    <div class="form-group">
                        <label for="signin-email">Email Address</label>
                        <input type="email" id="signin-email" class="form-control" placeholder="rohan@example.com" value="rohan@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signin-password">Password</label>
                        <input type="password" id="signin-password" class="form-control" placeholder="••••••••••••" value="password123" required>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 0.85rem;">
                        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--gray-600);">
                            <input type="checkbox" checked style="accent-color: var(--primary);"> Remember Me
                        </label>
                        <a href="#" style="color: var(--primary); font-weight: 600;">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="padding: 12px;">
                        Sign In <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </form>
            </div>

            <!-- 2. REGISTER PANEL -->
            <div class="auth-panel panel-register">
                <form action="index.html" method="GET">
                    <div class="form-group">
                        <label for="reg-name">Full Name</label>
                        <input type="text" id="reg-name" class="form-control" placeholder="Rohan Sharma" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="form-control" placeholder="rohan@example.com" required>
                    </div>

                     <div class="form-group">
                        <label for="reg-email">Mobile Number</label>
                        <input type="number" id="reg-Mobile" class="form-control" placeholder="0123456789" required>
                    </div>

                    <div class="form-group">
                        <label for="reg-password">Create Password</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="At least 8 characters" required>
                    </div>

                    <div style="margin-bottom: 20px; font-size: 0.85rem;">
                        <label style="display: flex; align-items: flex-start; gap: 6px; cursor: pointer; color: var(--gray-600);">
                            <input type="checkbox" checked style="accent-color: var(--primary); margin-top: 3px;">
                            <span>I agree to Shoe Nexus Terms of Service & Privacy Policy.</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary btn-block" style="padding: 12px;">
                        Create Account <i class="fa-solid fa-user-plus"></i>
                    </button>
                </form>
            </div>

            <!-- Back to Home & Admin Links -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px; font-size: 0.88rem; color: var(--gray-500); border-top: 1px solid var(--gray-200); padding-top: 16px;">
                <a href="index.html" style="color: var(--dark-800); font-weight: 600;">
                    <i class="fa-solid fa-arrow-left"></i> Home
                </a>
                <a href="admin/login.html" style="color: var(--primary); font-weight: 600;">
                    <i class="fa-solid fa-lock"></i> Admin Console
                </a>
            </div>
        </div>
    </div>

</body>
</html>
